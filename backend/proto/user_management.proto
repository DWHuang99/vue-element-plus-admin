syntax = "proto3";
package usermanagement;

option go_package = "vue-element-plus-admin/backend/pb;pb";

service UserManagementService {
  rpc CountUsersByDepartment(CountUsersByDepartmentRequest) returns (CountUsersByDepartmentResponse);
}

message CountUsersByDepartmentRequest {
  int64 department_id = 1;
}

message CountUsersByDepartmentResponse {
  int64 count = 1;
}
