# Admin BFF-owned queries (data-model.md Ownership matrix): workflow-state
# queries only, no domain reads. The full adapter query set lands with the
# US1 workflow-store implementation; workflows.sql anchors this package.
# Paths are relative to this file.
version: "2"

sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../migrations"
    gen:
      go:
        package: "sqlc"
        out: "../../internal/adminbff/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
