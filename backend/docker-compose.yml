version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: scaffold-postgres
    environment:
      POSTGRES_USER: scaffold
      POSTGRES_PASSWORD: scaffold_dev
      POSTGRES_DB: scaffold_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaffold -d scaffold_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
